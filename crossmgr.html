<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>...</title>
<style>
  #chart {width:95%;height:300px;border:1px solid #aaa;}
</style>
</head>
<body>

<center>
<h1 id="curprice">...</h1>
<canvas id="chart" onclick="drawLine()"></canvas>
<br/>
<button onclick="updateHist('3m')">1 day</button>
<button onclick="updateHist('15m')">5 days</button>
<button onclick="updateHist('1h')">20 days</button>

<p><i>query params "coin", "mul" and "rel" are supported</i></p>

<script>
// need to use binance.us if we detect user is in US
var apiBaseUrl = 'https://api.binance.com/api/v3/';

var coin = location.href.match(/coin=([a-z]+)/i);
coin = coin ? coin[1].toUpperCase() : 'TON'; 
var rel = location.href.match(/rel=([a-z]+)/i);
rel = rel ? rel[1].toUpperCase() : 'SUI';

var chart = document.getElementById('chart');
var ctx = chart.getContext('2d');
var hist = [];

function identityKline(interval, limit) {
  var res = [];
  var ts = new Date().getTime();
  for (var i = 0; i < limit; i++)
    res.push([ts, 1, 1, 1, 1]);
  return res;
}

function klines(sym, interval, limit, fn) {
  if (sym == 'USDT') {
    fn(identityKline(interval, limit));
    return;
  }
  var url = 'https://api.binance.com/api/v3/klines?symbol=' + sym +
    'USDT&interval=' + interval + '&limit=' + limit;
  var req = new XMLHttpRequest();
  req.onreadystatechange = function() {
    if (req.readyState == 4 && req.status == 200) {
      fn(JSON.parse(req.responseText));
    }
  }
  req.open('GET', url, true);
  req.send(null);
}

function prices(symbols, fn) {
  symbols = JSON.stringify(symbols.filter((s) => s != 'USDT').map((s) => s+'USDT'));
  var url = 'https://api.binance.com/api/v3/ticker/price?symbols=' + symbols;
  var req = new XMLHttpRequest();
  req.onreadystatechange = function() {
    if (req.readyState == 4 && req.status == 200) {
      var res = {USDT: 1.0};
      var res1 = JSON.parse(req.responseText).forEach((v) => {
        res[v.symbol.substring(0, v.symbol.length-4)] = v.price * 1});
      fn(res);
    }
  }
  req.open('GET', url, true);
  req.send(null);
}

function updateCur() {
  prices([coin, rel], (res) => {
    var ratio = res[coin] / res[rel];
    ratio = Number(ratio).toString().substring(0, 5);
    document.title = ratio;
    document.getElementById('curprice').innerText =
      ratio + ' (' + res[coin] + ' / ' + res[rel] + ')';
    setTimeout(updateCur, 7001);
  });
}

function updateHist(interval) {
  if (typeof(interval) == 'undefined') {
    interval = curInterval;
  } else {
    curInterval = interval;
  }
  klines(coin, interval, 480, (data) => {
    hist[coin] = parseHist(data);
    prepareData();
    setTimeout(updateHist, 31001);
  });
  klines(rel, interval, 480, (data) => {
    hist[rel] = parseHist(data);
    prepareData();
  });
}

function parseHist(d) {
  for (i = 0; i < d.length; i++) {
    var row = d[i];
    d[i] = (row[1]*1 + row[2]*2 + row[3]*2 + row[4]*1) / 6;
  }
  return d;
}

function prepareData() {
  if (hist[coin] === undefined || hist[rel] === undefined) return;
  var r = [];
  var maxR = Number.NEGATIVE_INFINITY;
  var minR = Number.POSITIVE_INFINITY;
  for (var i = 0; i < hist[coin].length; i++) {
    r[i] = hist[coin][i] / hist[rel][i];
    maxR = Math.max(maxR, r[i]);
    minR = Math.min(minR, r[i]);
  }
  hist['_'] = r;
  hist['_hi'] = maxR;
  hist['_lo'] = minR;
  tryDraw();
}

function tryDraw(barPos) {
  barPos = typeof(barPos) != 'undefined' ? barPos : null;
  var n = hist['_'].length;
  ctx.canvas.width = chart.clientWidth;
  ctx.canvas.height = chart.clientHeight;
  var hScale = chart.clientWidth / n;
  var vScale = chart.clientHeight / (hist['_hi'] - hist['_lo']);

  ctx.font = '32px monospace';
  ctx.fillStyle = barPos === null ? 'red' : 'pink';
  ctx.textBaseline = 'top';
  ctx.fillText(('' + hist['_hi']).substring(0, 5), 0, 0);
  ctx.textBaseline = 'bottom';
  ctx.fillText(('' + hist['_lo']).substring(0, 5), 0, ctx.canvas.height);
  var vertLines = curInterval == '3m' ? 12 : 10;
  for (var i = 1; i < vertLines; i++) {
    ctx.strokeStyle = (i % 2) ? '#cfc' : '#ccf';
    ctx.beginPath();
    var x = Math.round(i * chart.clientWidth / vertLines);
    ctx.moveTo(x, 0);
    ctx.lineTo(x, chart.clientHeight);
    ctx.stroke();
  }
  ctx.strokeStyle = '#000';
  for (var i = 1; i < n; i++) {
    ctx.beginPath();
    ctx.moveTo(Math.round((i-1) * hScale), Math.round((hist['_hi'] - hist['_'][i-1]) * vScale));
    ctx.lineTo(Math.round(i * hScale), Math.round((hist['_hi'] - hist['_'][i]) * vScale));
    ctx.stroke();
  }
  if (barPos !== null) {
    ctx.lineWidth = 1;
    ctx.strokeStyle = '#0044ff';
    ctx.fillStyle = '#0044ff';
    ctx.font = 'bold ' + ctx.font;
    if (barPos / chart.clientHeight < 1-1/1.618)
      ctx.textBaseline = 'top';
    ctx.beginPath();
    ctx.moveTo(0, barPos);
    ctx.lineTo(chart.clientWidth, barPos);
    ctx.stroke();
    var linePrice = hist['_hi'] - (hist['_hi'] - hist['_lo']) * barPos / chart.clientHeight;
    ctx.fillText(('' + linePrice).substring(0, 5), 0, barPos);
  }
}

function drawLine() {
    var x = event.clientX - chart.offsetLeft;
    var y = event.clientY - chart.offsetTop;
    tryDraw(y);
}

updateCur();

updateHist('3m');

</script>
</body>
</html>
